name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  roadmap-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: marlinjai/actions-shared/roadmap-check@roadmap-check-v1
        with:
          max-age: 30

  # Typecheck, lint, unit and component tests, and the database-backed tests
  # against a throwaway Postgres. Added after a review fix broke a database
  # query that only `pnpm test:db` could catch: without this job nothing ran
  # the tests before a merge.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Throwaway credentials for a database that exists only for this job.
          POSTGRES_USER: receipts
          POSTGRES_PASSWORD: receipts
          POSTGRES_DB: receipts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U receipts -d receipts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # The suite's shared contacts database, as in production (PostgreSQL 17).
      contacts-postgres:
        image: postgres:17-alpine
        env:
          # Throwaway credentials for a database that exists only for this job.
          POSTGRES_USER: contacts
          POSTGRES_PASSWORD: contacts
          POSTGRES_DB: contacts_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U contacts -d contacts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://receipts:receipts@localhost:5432/receipts_test
      TEST_DATABASE_URL: postgresql://receipts:receipts@localhost:5432/receipts_test
      CONTACTS_TEST_DATABASE_URL: postgresql://contacts:contacts@localhost:5433/contacts_test
    steps:
      - uses: actions/checkout@v4
      # The contact tables are opened only through @marlinjai/contacts-core, which
      # keeps every query scoped to one company. A statement that names them
      # directly, in raw SQL, would bypass that scope, so it fails the job.
      - name: Guard against raw SQL on the contact tables
        run: |
          if git grep -nIE '(FROM|INTO|UPDATE|JOIN|TABLE)[[:space:]]+"?(contacts|tenant_counters)"?([^[:alnum:]_]|$)' -- src scripts test; then
            echo "Raw SQL on the shared contact tables found. Go through @marlinjai/contacts-core instead."
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Apply migrations to the test database
        run: pnpm prisma migrate deploy
      # The migrations are written by hand. This fails when the database they
      # produce differs from prisma/schema.prisma (a missed column, an index
      # name Postgres truncated differently), which no test would notice.
      - name: Check that the migrations produce the schema
        run: pnpm prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: pnpm test:db
